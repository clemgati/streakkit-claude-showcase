name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared module (JVM + Kotlin/Native)
    # macOS because `:shared:allTests` includes the iosSimulatorArm64 target. Running only the
    # JVM half on Linux would be cheaper and would miss exactly the bugs this repo cares about.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run shared tests on every target
        run: ./gradlew :shared:allTests --console=plain

      - name: Parity gate
        # The same analysis `mcp__streakkit__expect_actual_matrix` answers in a session, as a
        # plain CLI call. Exits 1 on a missing actual or one-sided UI field, so it gates the branch.
        run: python3 .claude/mcp/streakkit_mcp.py parity

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shared-test-reports
          path: shared/build/reports/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: streakkit-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build for the simulator
        # The .xcodeproj is committed, so XcodeGen is not needed in CI. A generic destination
        # avoids pinning a device name that Xcode drops in the next runner image.
        run: |
          cd iosApp
          xcodebuild -project StreakKit.xcodeproj -scheme StreakKit \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build | tail -20

  lint:
    name: Formatting
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: brew install ktlint swiftformat
      - name: ktlint
        run: ktlint "shared/src/**/*.kt" "androidApp/src/**/*.kt"
      - name: swiftformat
        run: swiftformat --lint iosApp/StreakKit
