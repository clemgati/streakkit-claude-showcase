# Automation mode: a `prompt` is supplied, so this runs on every PR without being mentioned.
#
# The review is deliberately narrow. A reviewer that comments on everything gets muted; this one
# is told what this repo actually cares about and what to stay silent about.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(python3 .claude/mcp/streakkit_mcp.py)"
          prompt: |
            Review this pull request against the rules in CLAUDE.md. Post inline comments with
            mcp__github_inline_comment__create_inline_comment, one per finding, and nothing else.

            This is a Kotlin Multiplatform repo where both apps render the same shared state.
            Look for, in priority order:

            1. Business logic that escaped the shared module — arithmetic, rounding, string
               formatting or date handling inside a Compose composable or a SwiftUI view. This is
               the defect this codebase is organised to prevent, and it compiles fine.
            2. A change applied to one app but not the other. If HabitCard.kt changed, ask whether
               HabitCardView.swift needed the same change, and say so explicitly.
            3. A new or changed `expect` without both `actual`s.
            4. Shared logic changed without a test in shared/src/commonTest, or a persisted field
               added to Habit without a default value (older stored JSON would stop decoding).
            5. A streak/date edge case the diff gets wrong. The invariants are in the KDoc on
               StreakCalculator and in .claude/skills/streak-rules/reference.md.

            Stay silent about: formatting (ktlint and swiftformat gate that in CI), naming,
            file organisation, and idiomatic differences between Compose and SwiftUI. Do not
            comment to say a change looks good.

            If you find nothing from the list above, post no comments at all.
