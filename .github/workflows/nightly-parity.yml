# Scheduled automation: the drift check that nobody remembers to run.
#
# Parity decays between releases, not during them — a hotfix lands on iOS, the Android equivalent
# is "tomorrow", and tomorrow never comes. A nightly audit turns that into an issue with a name.
name: Nightly parity audit

on:
  schedule:
    - cron: "0 6 * * 1-5" # 06:00 UTC, weekdays
  workflow_dispatch: # so you can try it without waiting a day

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # Cheap, deterministic check first. If this is clean, the model may still find
      # judgement-level drift, but at least the mechanical part costs nothing.
      - name: Mechanical parity report
        id: matrix
        # Cheap and deterministic. `parity` exits 1 when it finds drift, so `|| true` keeps the
        # job alive to let the model do the judgement half either way.
        run: |
          {
            echo 'report<<EOF'
            python3 .claude/mcp/streakkit_mcp.py parity || true
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          # The `gh` CLI that Claude invokes from Bash needs its own credential; the action's
          # `github_token` input authenticates the action, not the shell it spawns. Without this
          # every `gh issue edit` fails and the job still reports success, which is how the first
          # run of this workflow did nothing at all.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Set EITHER secret; the unset one is an empty string and is ignored.
          # See .github/workflows/claude.yml for the full note.
          # Authenticate as the workflow's own token rather than the Claude GitHub App, so no
          # app installation is required. See .github/workflows/claude.yml for the trade-offs;
          # this workflow only reads code and writes issues/comments, so they do not bite here.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh issue list *),Bash(gh issue create *)"
          prompt: |
            Audit cross-platform parity between the Compose and SwiftUI apps.

            The mechanical report is already done:

            ${{ steps.matrix.outputs.report }}

            Your job is the part it cannot check: read these pairs side by side and find places
            where the two apps render the same shared field but behave differently.

              androidApp/.../ui/HabitCard.kt       <-> iosApp/StreakKit/Views/HabitCardView.swift
              androidApp/.../ui/HabitListScreen.kt <-> iosApp/StreakKit/Views/HabitListView.swift
              androidApp/.../ui/QuoteCard.kt       <-> iosApp/StreakKit/Views/QuoteCardView.swift

            Report only differences a user could notice or a developer could be misled by:
            different wording for the same state, different rounding, a state branch handled on
            one side only, or a tappable element that is not tappable on the other platform.
            Idiomatic differences between the two frameworks are NOT findings.

            Then:
            - If the mechanical report shows no drift and you find nothing, print
              "Parity holds" and create no issue. This is the expected outcome most nights.
            - Otherwise check `gh issue list --label parity --state open` first. If an open issue
              already covers it, do nothing. If not, open ONE issue titled
              "Parity drift: <short description>", labelled `parity`, containing the table above
              and your findings with file references.

            Never open an issue per finding, and never open a second issue for drift that is
            already tracked.
