# Interactive mode: no `prompt` input, so Claude waits to be mentioned.
#
# Mention @claude in an issue or PR comment and it responds in that thread, with the repository
# checked out — so CLAUDE.md, the skills in .claude/, and the committed .mcp.json catalogue all
# apply exactly as they do locally.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: anthropics/claude-code-action@v1
        with:
          # Both credentials are declared; an unset secret interpolates to an empty string and
          # the action falls through to the other. Set EITHER one and the workflows just work:
          #   subscription:  claude setup-token  ->  gh secret set CLAUDE_CODE_OAUTH_TOKEN
          #   metered API:   console.anthropic.com  ->  gh secret set ANTHROPIC_API_KEY
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(./gradlew :shared:allTests*),Bash(./gradlew :androidApp:assembleDebug*),Read,Grep,Glob,Edit,Write"
