# Interactive mode: no `prompt` input, so Claude waits to be mentioned.
#
# Mention @claude in an issue or PR comment and it responds in that thread, with the repository
# checked out — so CLAUDE.md, the skills in .claude/, and the committed .mcp.json catalogue all
# apply exactly as they do locally.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: anthropics/claude-code-action@v1
        env:
          # The `gh` CLI that Claude invokes from Bash needs its own credential; the action's
          # `github_token` input authenticates the action, not the shell it spawns. Without this
          # every `gh issue edit` fails and the job still reports success, which is how the first
          # run of this workflow did nothing at all.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Both credentials are declared; an unset secret interpolates to an empty string and
          # the action falls through to the other. Set EITHER one and the workflows just work:
          #   subscription:  claude setup-token  ->  gh secret set CLAUDE_CODE_OAUTH_TOKEN
          #   metered API:   console.anthropic.com  ->  gh secret set ANTHROPIC_API_KEY
          # Authenticate as the workflow's own token instead of the Claude GitHub App.
          #
          # Without this the action exchanges an OIDC token for an app token, which requires the
          # app to be installed on the repository. Supplying github_token skips that exchange.
          #
          # Two consequences, both deliberate trade-offs:
          #   - Claude's comments appear as github-actions[bot] rather than as Claude.
          #   - GitHub does not trigger workflows on commits made with the default token, so CI
          #     will NOT re-run on pushes this job makes. That matters here, because this
          #     workflow can push code. Install the app and delete this line to restore both.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(./gradlew :shared:allTests*),Bash(./gradlew :androidApp:assembleDebug*),Read,Grep,Glob,Edit,Write"
