# Automation mode on `issues: opened` — triage happens before a human reads the issue.
#
# What makes this worth running on a KMP repo: the single most useful fact about a bug report is
# whether it affects one platform or both, because "both" means the bug is in commonMain and is
# reproducible without a device.
name: Claude issue triage

on:
  issues:
    types: [opened, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set EITHER secret; the unset one is an empty string and is ignored.
          # See .github/workflows/claude.yml for the full note.
          # Authenticate as the workflow's own token rather than the Claude GitHub App, so no
          # app installation is required. See .github/workflows/claude.yml for the trade-offs;
          # this workflow only reads code and writes issues/comments, so they do not bite here.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 10
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Bash(gh issue edit *),Bash(gh issue comment *),Bash(python3 .claude/mcp/streakkit_mcp.py)"
          prompt: |
            Triage issue #${{ github.event.issue.number }} in this repository.

            Title: ${{ github.event.issue.title }}

            Decide three things, then act once and stop:

            1. **Layer.** shared domain / shared presentation / Android UI / iOS UI / build.
               The deciding question is whether the report mentions one platform or both — a
               symptom on both is a commonMain bug.
            2. **Is the reported number actually wrong?** If the report is about a streak, a
               best-streak or a completion percentage and it includes dates, verify the expected
               value with the streak oracle before assuming a bug:

                   python3 .claude/mcp/streakkit_mcp.py

               (send an `initialize` then a `tools/call` for `streak_oracle`). If the oracle says
               the displayed number is correct, label `needs-repro` and say which invariant from
               .claude/skills/streak-rules/reference.md explains the behaviour — "a streak may be
               anchored on yesterday" resolves most of these.
            3. **Labels**, from exactly this set: shared, android, ios, build, bug, parity,
               needs-repro, good-first-issue. Use `parity` whenever the two platforms disagree.

            Then: apply the labels with `gh issue edit`, and post ONE comment with your layer
            assessment, the file you believe is responsible, and your confidence. Do not open a
            PR, do not change code, and do not close the issue.
